services:
  - type: web
    name: my-wardrobe
    runtime: static
    repo: https://github.com/YOUR_USERNAME/my-wardrobe.git
    branch: main
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /style.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /app.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
